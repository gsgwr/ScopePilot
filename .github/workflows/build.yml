name: Build ScopePilot

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: tools/playwright-runtime/package-lock.json

      - name: Restore Playwright MCP runtime
        working-directory: tools/playwright-runtime
        run: npm ci

      - name: Restore .NET packages
        run: dotnet restore ScopePilot.csproj

      - name: Build
        run: dotnet build ScopePilot.csproj -c Release --no-restore

      - name: Publish Windows package
        run: dotnet publish ScopePilot.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScopePilot-win-x64
          path: publish
